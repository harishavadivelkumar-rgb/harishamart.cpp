<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HarishaMart | Marketplace</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div class="brand">Harisha<span>Mart</span></div><div class="tag">Your little marketplace</div></header>
<main>
  <section class="hero"><div><p class="eyebrow">SHOP SMART • SHOP EASY</p><h1>Find your next<br><span>favourite thing.</span></h1><p class="muted">A simple marketplace powered by C++ and SQLite.</p></div><div class="hero-icon">🛍️</div></section>
  <section class="panel">
    <div class="section-head"><div><p class="eyebrow">MARKETPLACE</p><h2>Products</h2></div><input id="search" placeholder="Search products..." aria-label="Search products"></div>
    <p id="status" class="muted">Connecting to backend…</p><div id="products" class="products"></div>
  </section>
  <section class="panel">
    <p class="eyebrow">SELLER TOOLS</p><h2>Add a product</h2>
    <form id="product-form" class="form-grid">
      <label>Product name<input name="name" required maxlength="100" placeholder="e.g. Notebook"></label>
      <label>Price (₹)<input name="price" type="number" min="0" step="0.01" required placeholder="99.00"></label>
      <label>Stock quantity<input name="stock" type="number" min="0" step="1" required placeholder="10"></label>
      <label>Category<input name="category" maxlength="60" placeholder="Stationery"></label>
      <label class="wide">Description<textarea name="description" rows="2" maxlength="500" placeholder="Short product description"></textarea></label>
      <button type="submit">＋ Save product</button>
    </form>
  </section>
</main>
<footer>HarishaMart • College capstone MVP</footer><script src="/app.js"></script>
</body></html>
